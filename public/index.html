<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile Atlas</title>
  <style>
    :root{--bg:#f7f8fa;--card:#fff;--text:#1c2632;--muted:#667085;--line:#d9e0e7;--button:#263544;--danger:#b42318}html[data-theme=dark]{--bg:#11171d;--card:#192129;--text:#f1f5f9;--muted:#a9b4bf;--line:#34404b;--button:#e5edf5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1040px;margin:auto;padding:0 20px}header{height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand,h1{font-family:Georgia,serif}.brand{font-size:22px;font-weight:bold}button,input{font:inherit}.theme{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:8px 11px;cursor:pointer}main{padding:45px 0 70px}.hero{max-width:700px}.eyebrow{font:700 12px sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(36px,5vw,56px);line-height:1;margin:12px 0}p{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:28px}label{display:block;font-weight:700;margin-bottom:9px}.row{display:flex;gap:10px}input{flex:1;min-width:0;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);outline:0}input:focus{outline:3px solid #70809055}input.invalid{border-color:var(--danger)}.primary{border:0;border-radius:10px;background:var(--button);color:var(--card);padding:12px 18px;font-weight:700;cursor:pointer}.error{color:var(--danger);font-size:14px;display:none}.status{min-height:22px}.empty,.failure{text-align:center;border:1px dashed var(--line);border-radius:16px;padding:38px;margin-top:22px}.failure{display:none;border-style:solid;color:var(--danger)}#results{display:none}.profile{display:flex;gap:16px;align-items:center}.avatar{width:64px;height:64px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:24px;font-weight:bold;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.wide{grid-column:1/-1}.panel{padding:18px;border:1px solid var(--line);border-radius:14px}.panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;color:var(--muted)}.item{border-left:2px solid var(--button);padding:0 0 14px 12px;margin-bottom:10px}.item span{display:block;color:var(--muted);font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:14px}@media(max-width:650px){.row{flex-direction:column}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body><div class="wrap"><header><div class="brand">Profile Atlas</div><button class="theme" id="theme" type="button">Dark mode</button></header><main><section class="hero"><span class="eyebrow">Profile lookup</span><h1>Professional context, at a glance.</h1><p>Enter a public LinkedIn profile URL to retrieve available information.</p></section><section class="card"><label for="url">LinkedIn profile URL</label><div class="row"><input id="url" name="url" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://www.linkedin.com/in/name/"><button class="primary" id="go" type="button">Fetch profile</button></div><p class="error" id="error">Enter a valid LinkedIn /in/ profile URL.</p></section><p class="status" id="status" aria-live="polite"></p><section class="empty" id="empty">Paste a profile URL above to get started.</section><section class="failure" id="failure"></section><section id="results"><article class="card profile"><div class="avatar" id="avatar">?</div><div><h2 id="name"></h2><p id="headline"></p><p id="location"></p></div></article><div class="grid"><article class="panel wide"><h3>About</h3><p id="about"></p></article><article class="panel"><h3>Experience</h3><div id="experience"></div></article><article class="panel"><h3>Education</h3><div id="education"></div></article><article class="panel"><h3>Skills</h3><div class="chips" id="skills"></div></article><article class="panel"><h3>Certifications</h3><div id="certifications"></div></article><article class="panel"><h3>Languages</h3><div class="chips" id="languages"></div></article></div></section></main></div><script>
const $=id=>document.getElementById(id),safe=v=>String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),valid=u=>/^https?:\/\/(?:www\.|m\.)?linkedin\.com\/in\/[^/?#]+\/?(?:[?#].*)?$/i.test(u);$('theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';$('theme').textContent=d?'Dark mode':'Light mode'};function items(id,a,f){$(id).innerHTML=a?.length?a.map(f).join(''):'Not available'}async function run(){let u=$('url').value.trim();$('error').style.display=valid(u)?'none':'block';if(!valid(u))return;$('go').disabled=true;$('go').textContent='Fetching...';$('failure').style.display='none';try{let r=await fetch('/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})}),d=await r.json();if(!r.ok)throw Error(d.detail);$('name').textContent=d.name||'Profile';$('headline').textContent=d.headline||'';$('location').textContent=d.location||'';$('about').textContent=d.about||'Not available';$('avatar').innerHTML=d.profile_image?'<img src="'+safe(d.profile_image)+'" alt="">':safe((d.name||'?')[0]);items('experience',d.experience,x=>'<div class=item><b>'+safe(x.title)+'</b><span>'+safe(x.company)+'</span><span>'+safe(x.start_date)+' — '+safe(x.end_date)+'</span></div>');items('education',d.education,x=>'<div class=item><b>'+safe(x.school)+'</b><span>'+safe(x.degree)+'</span></div>');items('skills',d.skills,x=>'<span class=chip>'+safe(x)+'</span>');items('certifications',d.certifications,x=>'<div class=item><b>'+safe(x.name)+'</b><span>'+safe(x.issuer)+'</span></div>');items('languages',d.languages,x=>'<span class=chip>'+safe(x.name)+'</span>');$('empty').style.display='none';$('results').style.display='block';$('status').textContent='Profile retrieved.'}catch(e){$('failure').textContent=e.message||'Request failed.';$('failure').style.display='block'}finally{$('go').disabled=false;$('go').textContent='Fetch profile'}}$('go').onclick=run;$('url').onkeydown=e=>{if(e.key==='Enter')run()};
</script></body></html>
